# 式神。
#
# 字段取自 Data:Attribute.json 的实际结构（revid 9939）：
#   {"id":262,"name":"姑获鸟","rarity":"SR","atk":3082,"hp":10823,"def":397,
#    "spd":113,"cri":0.5,"crid":1.2,"efh":0,"efr":0}
#
# 注意 cri / crid 是**小数**（0.5 = 50%），单位声明为 fraction；
# 另一个来源 Data:Character/<id>.json 用百分数（crit.value = 50），
# 二者靠单位换算对齐。
entity: shikigami
description: 式神
metamodelVersion: 1
schemaRev: "2"

fields:
  - key: id
    description: 角色唯一 ID
    type: number
    unit: point
    precision: 0
    required: true
    identity: true

  - key: name
    description: 中文名
    type: text
    required: true

  - key: rarity
    description: 品阶
    type: enum
    required: true
    values: [素材, 呱, N, R, SR, SSR, SP, UR]

  - key: atk
    description: 攻击
    type: number
    unit: point
    min: 0
    required: true

  - key: hp
    description: 生命
    type: number
    unit: point
    min: 0
    required: true

  - key: def
    description: 防御
    type: number
    unit: point
    min: 0
    required: true

  - key: spd
    description: 速度
    type: number
    unit: point
    min: 0
    required: true

  - key: cri
    description: 暴击率（小数口径，0.5 = 50%）
    type: number
    unit: fraction
    required: true

  - key: crid
    description: 暴击伤害（小数口径，1.2 = 120%）
    type: number
    unit: fraction
    required: true

  - key: efh
    description: 效果命中
    type: number
    unit: fraction
    required: true

  - key: efr
    description: 效果抵抗
    type: number
    unit: fraction
    required: true

  # 派生字段（L3）：由 crit_factor 公式从 cri 与 crid 算出，不是从原件直取的。
  #
  # 它**必须在这里声明**。派生走的不是准入层，因此不会被「未声明谓词」过滤掉——
  # 不声明的话它就会以「数据里有而 schema 未声明」的漂移形式挂在数据页上，
  # 让人分不清那是一个错误还是一个正常的派生字段。
  #
  # 非必填：素材类式神没有面板，也就没有暴击系数。
  - key: crit_factor
    description: 期望暴击系数（= 1 + cri × crid，派生 L3）
    type: number
    unit: fraction
