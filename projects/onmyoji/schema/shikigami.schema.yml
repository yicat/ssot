# 式神。
#
# 字段取自 Data:Attribute.json 的实际结构（revid 9939）：
#   {"id":262,"name":"姑获鸟","rarity":"SR","atk":3082,"hp":10823,"def":397,
#    "spd":113,"cri":0.5,"crid":1.2,"efh":0,"efr":0}
#
# 注意 cri / crid 是**小数**（0.5 = 50%），单位声明为 fraction；
# 另一个来源 Data:Character/<id>.json 用百分数（crit.value = 50），
# 二者靠单位换算对齐。
entity: shikigami
description: 式神
metamodelVersion: 1
schemaRev: "1"

fields:
  - key: id
    description: 角色唯一 ID
    type: number
    unit: point
    precision: 0
    required: true
    identity: true

  - key: name
    description: 中文名
    type: text
    required: true

  - key: rarity
    description: 品阶
    type: enum
    required: true
    values: [素材, 呱, N, R, SR, SSR, SP, UR]

  - key: atk
    description: 攻击
    type: number
    unit: point
    min: 0
    required: true

  - key: hp
    description: 生命
    type: number
    unit: point
    min: 0
    required: true

  - key: def
    description: 防御
    type: number
    unit: point
    min: 0
    required: true

  - key: spd
    description: 速度
    type: number
    unit: point
    min: 0
    required: true

  - key: cri
    description: 暴击率（小数口径，0.5 = 50%）
    type: number
    unit: fraction
    required: true

  - key: crid
    description: 暴击伤害（小数口径，1.2 = 120%）
    type: number
    unit: fraction
    required: true

  - key: efh
    description: 效果命中
    type: number
    unit: fraction
    required: true

  - key: efr
    description: 效果抵抗
    type: number
    unit: fraction
    required: true
